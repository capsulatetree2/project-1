<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>新規登録 - IT学習プラットフォーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-gray-100 text-gray-800">
  <!-- Header -->
  <header class="bg-gray-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">新規登録</h1>
      <nav class="space-x-4">
        <a href="index.html" class="hover:underline">ホーム</a>
        <a href="login.html" class="hover:underline">ログイン</a>
        <a href="support.html" class="hover:underline">サポート</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-2xl mx-auto px-4 py-12">
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-xl font-bold mb-6">アカウントを作成</h2>
      <form action="/register" method="post" autocomplete="on">
        <!-- 氏名 -->
        <label for="name" class="block mb-4">
          <span class="text-gray-700">氏名</span>
          <input id="name" name="name" type="text" class="mt-1 p-2 border rounded w-full" required />
        </label>

        <!-- メールアドレス -->
        <label for="email" class="block mb-4">
          <span class="text-gray-700">メールアドレス</span>
          <input id="email" name="email" type="email" class="mt-1 p-2 border rounded w-full" required />
        </label>

        <!-- 電話番号 -->
        <label for="phone" class="block mb-4">
          <span class="text-gray-700">電話番号</span>
          <input id="phone" name="phone" type="tel" class="mt-1 p-2 border rounded w-full" required />
        </label>

        <!-- パスワード -->
        <label for="password" class="block mb-4">
          <span class="text-gray-700">パスワード</span>
          <input id="password" name="password" type="password" class="mt-1 p-2 border rounded w-full" required />
        </label>

        <!-- パスワード確認 -->
        <label for="confirm-password" class="block mb-4">
          <span class="text-gray-700">パスワード（確認）</span>
          <input id="confirm-password" name="confirm_password" type="password" class="mt-1 p-2 border rounded w-full" required />
        </label>

        <!-- 利用規約同意 -->
      <div class="mb-6 inline-flex items-center whitespace-nowrap">
  <label for="terms" class="text-gray-700 text-sm mr-1">
    利用規約に同意します
  </label>
  <input id="terms" name="terms" type="checkbox" required class="accent-green-600" />
</div>



        <!-- 登録ボタン -->
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 w-full">
          登録する
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white py-6 mt-20">
    <div class="max-w-6xl mx-auto text-center">
      <p>&copy; 2025 IT学習プラットフォーム | 新規登録ページ</p>
    </div>
  </footer>
</body>
</html>
