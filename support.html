<!DOCTYPE html>
<html lang="ja">
    <link rel="stylesheet" href="style.css">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サポート - IT学習プラットフォーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">
  <!-- Header -->
  <header class="bg-gray-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">サポート</h1>
      <nav class="space-x-4">
        <a href="index.html" class="hover:underline">ホーム</a>
        <a href="exam-practice.html" class="hover:underline">試験対策</a>
        <a href="#" onclick="history.back()" class="hover:underline">戻る</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-3xl mx-auto px-4 py-12">
    <h2 class="text-3xl font-bold text-center mb-8">お問い合わせフォーム</h2>
    <form class="bg-white p-6 rounded-xl shadow">
      <label class="block mb-4">
        <span class="text-gray-700">お名前</span>
        <input type="text" class="w-full mt-1 p-2 border rounded" placeholder="山田 太郎" required>
      </label>
      <label class="block mb-4">
        <span class="text-gray-700">メールアドレス</span>
        <input type="email" class="w-full mt-1 p-2 border rounded" placeholder="example@example.com" required>
      </label>
      <label class="block mb-4">
        <span class="text-gray-700">お問い合わせ内容</span>
        <textarea class="w-full mt-1 p-2 border rounded" rows="5" placeholder="ご質問内容を入力してください..." required></textarea>
      </label>
      <div class="text-right">
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">送信</button>
      </div>
    </form>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white py-6 mt-20">
    <div class="max-w-6xl mx-auto text-center">
      <p>&copy; 2025 IT学習プラットフォーム | サポートページ</p>
    </div>
  </footer>
</body>
</html>
