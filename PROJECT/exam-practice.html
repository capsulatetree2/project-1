<!DOCTYPE html>
<html lang="ja">
  <link rel="stylesheet" href="style.css">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試験対策 - IT学習プラットフォーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">
  <!-- Header -->
  <header class="bg-gray-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">試験対策</h1>
      <nav class="space-x-4">
        <a href="index.html" class="hover:underline">ホーム</a>
        <a href="support.html" class="hover:underline">サポート</a>
        <a href="#" onclick="history.back()" class="hover:underline">戻る</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 py-10">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">模擬問題セクション</h2>

    <!-- Sample Question Block -->
    <div class="bg-white rounded-xl shadow-md p-6 mb-6">
      <h3 class="text-xl font-bold mb-2">問題 1: プログラムの出力</h3>
      <p class="mb-4">次のJavaプログラムの出力は何ですか？</p>
      <pre class="bg-gray-100 p-4 rounded text-sm overflow-x-auto">
public class Main {
  public static void main(String[] args) {
    int x = 5;
    x++;
    System.out.println(x);
  }
}</pre>
      <form class="mt-4">
        <label class="block mb-2">
          <input type="radio" name="q1" class="mr-2"> A. 4
        </label>
        <label class="block mb-2">
          <input type="radio" name="q1" class="mr-2"> B. 5
        </label>
        <label class="block mb-2">
          <input type="radio" name="q1" class="mr-2"> C. 6
        </label>
        <label class="block mb-2">
          <input type="radio" name="q1" class="mr-2"> D. コンパイルエラー
        </label>
      </form>
    </div>

    <!-- More questions can be added in same format -->

    <div class="text-center mt-10">
      <button class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">提出する</button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white py-6 mt-20">
    <div class="max-w-6xl mx-auto text-center">
      <p>&copy; 2025 IT学習プラットフォーム | 試験対策ページ</p>
    </div>
  </footer>
</body>
</html>
