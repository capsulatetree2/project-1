<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ログイン - IT学習プラットフォーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-gray-100 text-gray-800">
  <!-- Header -->
  <header class="bg-gray-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">ログイン</h1>
      <nav class="space-x-4">
        <a href="index.html" class="hover:underline">ホーム</a>
        <a href="support.html" class="hover:underline">サポート</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-xl font-bold mb-4">ログイン</h2>
      <form action="/login" method="post" autocomplete="on">
        <label for="login-email" class="block mb-4">
          <span class="text-gray-700">メールアドレス</span>
          <input id="login-email" name="email" type="email" class="mt-1 p-2 border rounded w-full" required />
        </label>
        <label for="login-password" class="block mb-6">
          <span class="text-gray-700">パスワード</span>
          <input id="login-password" name="password" type="password" class="mt-1 p-2 border rounded w-full" required />
        </label>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full">ログイン</button>
      </form>
      <p class="text-center mt-6 text-sm text-gray-600">
        アカウントをお持ちでない方は
        <a href="newuser.html" class="text-blue-600 hover:underline">新規登録はこちら</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white py-6 mt-20">
    <div class="max-w-6xl mx-auto text-center">
      <p>&copy; 2025 IT学習プラットフォーム | ログインページ</p>
    </div>
  </footer>
</body>
</html>
